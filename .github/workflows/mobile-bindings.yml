name: Mobile Go bindings

on:
  workflow_dispatch:
    inputs:
      build_apps:
        description: Build the Android APK and unsigned iPhone IPA
        type: boolean
        default: false
      platform:
        description: Platform to build
        type: choice
        default: Both
        options:
          - Both
          - Android
          - iOS

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'iOS' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'iOS' && '["iOS"]' || inputs.platform == 'Android' && '["Android"]' || '["Android", "iOS"]') }}
    env:
      MOBILE_TOOLS_VERSION: v0.0.0-20261117202452-47699113848a
      MOBILE_TARGET: ${{ matrix.platform == 'iOS' && 'ios,iossimulator' || 'android/arm64,android/amd64' }}
      MOBILE_OUTPUT: ${{ matrix.platform == 'iOS' && 'HyRouteCore.xcframework' || 'HyRouteCore.aar' }}
      FLUTTER_VERSION: '3.44.0'
      FLUTTER_REVISION: 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Boot iPhone simulator
        if: inputs.build_apps && matrix.platform == 'iOS'
        shell: bash
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices,reverse=True) for d in devices[runtime] if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device"
          printf 'HYROUTE_SIMULATOR=%s\n' "$device" >> "$GITHUB_ENV"
      - name: Reuse the verified 0.3.5 iOS core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45071275393 --repo "$GITHUB_REPOSITORY" --name HyRouteCore-iOS --dir "$RUNNER_TEMP/core"
          mkdir -p dist
          framework="$(find "$RUNNER_TEMP/core" -type d -name HyRouteCore.xcframework -print -quit)"
          if [[ -z "$framework" ]]; then framework="$RUNNER_TEMP/core"; fi
          mv "$framework" dist/HyRouteCore.xcframework
          test -f dist/HyRouteCore.xcframework/Info.plist
          printf 'HYROUTE_APP_VERSION=0.3.5\n' >> "$GITHUB_ENV"
      - name: Open SwiftUI on an iPhone simulator
        if: inputs.build_apps && matrix.platform == 'iOS'
        working-directory: app/ios
        timeout-minutes: 8
        shell: bash
        run: |
          device="$HYROUTE_SIMULATOR"
          trap 'xcrun simctl shutdown "$device"' EXIT
          output="$RUNNER_TEMP/hyroute-iphonesimulator"
          xcodebuild -project HyRoute.xcodeproj -target HyRoute -configuration Debug \
            -sdk iphonesimulator ARCHS="$(uname -m)" CONFIGURATION_BUILD_DIR="$output" CODE_SIGNING_ALLOWED=NO -quiet
          bundle="$output/HyRoute.app"
          codesign --force --deep --sign - "$bundle"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark
          xcrun simctl install "$device" "$bundle"
          xcrun simctl launch "$device" io.hyroute.hyrouteMobile
          for screen in rules; do
            SIMCTL_CHILD_HYROUTE_LAYOUT_PREVIEW="$screen" \
              xcrun simctl launch --terminate-running-process "$device" io.hyroute.hyrouteMobile
            sleep 7
            xcrun simctl io "$device" screenshot "../../dist/HyRoute-iOS-$screen-$HYROUTE_APP_VERSION.png"
          done
          printf 'HYROUTE_APP_PREVIEW=dist/HyRoute-iOS-*-%s.png\n' "$HYROUTE_APP_VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.build_apps && matrix.platform == 'iOS'
        with:
          name: HyRoute-iOS-preview
          path: ${{ env.HYROUTE_APP_PREVIEW }}
          if-no-files-found: error
