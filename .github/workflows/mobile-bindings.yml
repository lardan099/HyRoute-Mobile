name: Mobile Go bindings

on:
  workflow_dispatch:
    inputs:
      build_apps:
        description: Build the Android APK and unsigned iPhone IPA
        type: boolean
        default: false
      platform:
        description: Platform to build
        type: choice
        default: Both
        options:
          - Both
          - Android
          - iOS
      ios_runner:
        description: Standard macOS runner for iOS builds
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26-intel
      ios_bindings_run:
        description: Reuse iOS bindings from a run with the same Go sources
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'iOS' && inputs.ios_runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.platform == 'iOS' && inputs.ios_runner == 'macos-26-intel' && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'iOS' && '["iOS"]' || inputs.platform == 'Android' && '["Android"]' || '["Android", "iOS"]') }}
    env:
      MOBILE_TOOLS_VERSION: v0.0.0-20261117202452-47699113848a
      MOBILE_TARGET: ${{ matrix.platform == 'iOS' && 'ios,iossimulator' || 'android/arm64,android/amd64' }}
      MOBILE_OUTPUT: ${{ matrix.platform == 'iOS' && 'HyRouteCore.xcframework' || 'HyRouteCore.aar' }}
      FLUTTER_VERSION: '3.44.0'
      FLUTTER_REVISION: 559ffa3f75e7402d65a8def9c28389a9b2e6fe42
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.ios_bindings_run != '' && '0' || '1' }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install Go mobile tools
        shell: bash
        run: |
          go get -tool "golang.org/x/mobile/cmd/gobind@${MOBILE_TOOLS_VERSION}"
          go install golang.org/x/mobile/cmd/gobind golang.org/x/mobile/cmd/gomobile
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Test mobile Go code
        shell: bash
        run: |
          go test -p 1 -coverprofile "$RUNNER_TEMP/hyroute-go-coverage.out" ./...
          go tool cover -func "$RUNNER_TEMP/hyroute-go-coverage.out" | tail -1
          go vet ./...
      - name: Boot a clean iPhone simulator
        if: inputs.build_apps && matrix.platform == 'iOS'
        shell: bash
        run: |
          read -r runtime model < <(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(runtime + " " + d["deviceTypeIdentifier"] for runtime in sorted(devices,reverse=True) for d in devices[runtime] if d["name"].startswith("iPhone")))')
          device="$(xcrun simctl create "HyRoute CI iPhone" "$model" "$runtime")"
          xcrun simctl boot "$device"
          printf 'HYROUTE_SIMULATOR=%s\n' "$device" >> "$GITHUB_ENV"
      - name: Select Android NDK
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          ndk_version=29.0.14206865
          ndk="$ANDROID_HOME/ndk/$ndk_version"
          test -d "$ndk"
          {
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk"
            printf 'ANDROID_NDK_ROOT=%s\n' "$ndk"
            printf 'HYROUTE_ANDROID_NDK_VERSION=%s\n' "$ndk_version"
          } >> "$GITHUB_ENV"
      - name: Build bindings
        if: matrix.platform != 'iOS' || inputs.ios_bindings_run == ''
        shell: bash
        run: |
          mkdir -p dist
          link_flags=()
          if [[ "$MOBILE_TARGET" == android/* ]]; then
            # Match Xray's Android release flags for its anet dependency.
            link_flags+=(-ldflags=-checklinkname=0)
          fi
          gomobile bind -trimpath "${link_flags[@]}" -androidapi 24 -target "$MOBILE_TARGET" -o "dist/$MOBILE_OUTPUT" ./mobile
      - name: Reuse verified iOS bindings
        if: matrix.platform == 'iOS' && inputs.ios_bindings_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_BINDINGS_RUN: ${{ inputs.ios_bindings_run }}
        run: |
          [[ "$IOS_BINDINGS_RUN" =~ ^[0-9]+$ ]]
          source="$(gh run view "$IOS_BINDINGS_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          git diff --exit-code "$source" "$GITHUB_SHA" -- go.mod go.sum internal mobile
          mkdir -p dist
          download="$(mktemp -d)"
          gh run download "$IOS_BINDINGS_RUN" --repo "$GITHUB_REPOSITORY" --name HyRouteCore-iOS --dir "$download"
          framework="$(find "$download" -type d -name HyRouteCore.xcframework -print -quit)"
          mv "${framework:-$download}" "dist/$MOBILE_OUTPUT"
          test -f "dist/$MOBILE_OUTPUT/Info.plist"
      - name: Build Android routing adapter
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          work="$(mktemp -d)"
          unzip -p dist/HyRouteCore.aar classes.jar > "$work/core.jar"
          javac --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar:$work/core.jar" \
            -d "$work/classes" mobile/android/src/main/java/io/hyroute/mobile/AndroidRouting.java
          jar cf dist/HyRouteAndroidRouting.jar -C "$work/classes" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform != 'iOS' || inputs.ios_bindings_run == ''
        with:
          name: HyRouteCore-${{ matrix.platform }}
          path: |
            dist/${{ env.MOBILE_OUTPUT }}
            dist/HyRouteAndroidRouting.jar
          if-no-files-found: error
      - name: Install Flutter
        if: inputs.build_apps && matrix.platform == 'Android'
        shell: bash
        run: |
          flutter_sdk="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$flutter_sdk"
          test "$(git -C "$flutter_sdk" rev-parse HEAD)" = "$FLUTTER_REVISION"
          printf '%s\n' "$flutter_sdk/bin" >> "$GITHUB_PATH"
      - name: Test Flutter client
        if: inputs.build_apps && matrix.platform == 'Android'
        working-directory: app
        shell: bash
        run: |
          flutter --suppress-analytics pub get --enforce-lockfile
          dart analyze
          flutter --suppress-analytics test --no-pub
      - name: Build Android debug APK
        if: inputs.build_apps && matrix.platform == 'Android'
        working-directory: app
        shell: bash
        run: |
          flutter --suppress-analytics build apk --debug --no-pub --target-platform android-arm64,android-x64
          version="$(awk '/^version:/{split($2, parts, /[+]/); print parts[1]; exit}' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          package="dist/HyRoute-Android-debug-$version.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "../$package"
          printf 'HYROUTE_APP_PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Check SwiftUI state compatibility
        if: inputs.build_apps && matrix.platform == 'iOS'
        working-directory: app/ios
        shell: bash
        run: |
          swiftc -o "$RUNNER_TEMP/hyroute-state-test" Native/Models.swift NativeTests/StateCompatibility.swift
          "$RUNNER_TEMP/hyroute-state-test"
          swiftc -o "$RUNNER_TEMP/hyroute-startup-test" Native/VPNStartup.swift NativeTests/VPNStartupTests.swift
          "$RUNNER_TEMP/hyroute-startup-test"
          swiftc -o "$RUNNER_TEMP/hyroute-geodata-test" Native/GeodataTransfer.swift NativeTests/GeodataTransferTests.swift
          "$RUNNER_TEMP/hyroute-geodata-test"
          swiftc -o "$RUNNER_TEMP/hyroute-command-test" Native/VPNCommand.swift NativeTests/VPNCommandTests.swift
          "$RUNNER_TEMP/hyroute-command-test"
      - name: Build unsigned iPhone IPA
        if: inputs.build_apps && matrix.platform == 'iOS'
        working-directory: app/ios
        shell: bash
        run: |
          output="$RUNNER_TEMP/hyroute-iphoneos"
          xcodebuild -project HyRoute.xcodeproj -target HyRoute -configuration Release \
            -sdk iphoneos CONFIGURATION_BUILD_DIR="$output" CODE_SIGNING_ALLOWED=NO -quiet
          bundle="$output/HyRoute.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleSupportedPlatforms:0' "$bundle/Info.plist" | grep -Fx iPhoneOS
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$bundle/Info.plist" | grep -Fx io.hyroute.hyrouteMobile
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$bundle/Info.plist")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          xcrun lipo "$bundle/HyRoute" -verify_arch arm64
          extension="$bundle/PlugIns/HyRouteTunnel.appex"
          xcrun lipo "$extension/HyRouteTunnel" -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist" | grep -Fx com.apple.networkextension.packet-tunnel
          test ! -d "$bundle/Frameworks/Flutter.framework"
          metadata="$bundle/Metadata.appintents/extract.actionsdata"
          test -s "$metadata"
          for intent in EnableVPNIntent DisableVPNIntent ChangeVPNServerIntent ReconnectVPNIntent; do
            grep -aFq "$intent" "$metadata"
            printf 'Packaged App Intent: %s\n' "$intent"
          done
          work="$(mktemp -d)"
          mkdir "$work/Payload"
          ditto "$bundle" "$work/Payload/HyRoute.app"
          package="dist/HyRoute-iOS-unsigned-$version.ipa"
          ditto -c -k --keepParent "$work/Payload" "../../$package"
          printf 'HYROUTE_APP_PACKAGE=%s\nHYROUTE_APP_VERSION=%s\n' "$package" "$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.build_apps
        with:
          name: HyRoute-App-${{ matrix.platform }}
          path: ${{ env.HYROUTE_APP_PACKAGE }}
          if-no-files-found: error
      - name: Test SwiftUI and capture iPhone previews
        if: inputs.build_apps && matrix.platform == 'iOS'
        working-directory: app/ios
        timeout-minutes: ${{ inputs.ios_runner == 'macos-26-intel' && 28 || 18 }}
        shell: bash
        run: |
          device="$HYROUTE_SIMULATOR"
          trap 'xcrun simctl shutdown "$device"' EXIT
          output="$RUNNER_TEMP/hyroute-iphonesimulator"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark
          status=0
          xcodebuild -project HyRoute.xcodeproj -scheme HyRoute -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath "$output" -resultBundlePath "$RUNNER_TEMP/hyroute-ui.xcresult" \
            CODE_SIGN_IDENTITY=- -quiet test || status=$?
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/hyroute-ui.xcresult"
          if [[ "$status" -ne 0 ]]; then exit "$status"; fi
          bundle="$output/Build/Products/Debug-iphonesimulator/HyRoute.app"
          xcrun simctl install "$device" "$bundle"
          for screen in home servers rules routing chains; do
            SIMCTL_CHILD_HYROUTE_LAYOUT_PREVIEW="$screen" \
              xcrun simctl launch --terminate-running-process "$device" io.hyroute.hyrouteMobile
            sleep 5
            xcrun simctl io "$device" screenshot "../../dist/HyRoute-iOS-$screen-$HYROUTE_APP_VERSION.png"
          done
          printf 'HYROUTE_APP_PREVIEW=dist/HyRoute-iOS-*-%s.png\n' "$HYROUTE_APP_VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.build_apps && matrix.platform == 'iOS'
        with:
          name: HyRoute-iOS-preview
          path: ${{ env.HYROUTE_APP_PREVIEW }}
          if-no-files-found: error
